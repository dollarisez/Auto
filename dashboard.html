<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="style.css"></head><body class="page"><header><strong>Dashboard</strong><button id="logout">Logout</button></header><main class="panel"><h2>Selamat datang, <span id="user"></span></h2><button id="run" class="run-btn" type="button">▶ JALANKAN</button><div id="frameMsg"></div><iframe id="frame" title="Konten" referrerpolicy="strict-origin-when-cross-origin"></iframe></main><script>async function init(){const r=await fetch('/api/me');const d=await r.json();if(!d.authenticated)return location='/';if(d.user.role==='admin')return location='/admin.html';document.getElementById('user').textContent=d.user.username;const x=await fetch('/api/iframe');const j=await x.json();if(j.url)document.getElementById('frame').src=j.url;else document.getElementById('frameMsg').textContent='URL iframe belum diatur admin.'}document.getElementById('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location='/'};init();</script></body></html>
