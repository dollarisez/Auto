<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body class="page"><header><strong>Admin Dashboard</strong><button id="logout">Logout</button></header><main class="panel"><h2>Kelola User</h2><form id="add"><input id="newUser" placeholder="Nama user" required><input id="newPass" type="password" placeholder="Password" required><button>Tambah User</button></form><div id="users"></div><hr><h2>URL Iframe</h2><form id="iframe"><input id="url" type="url" placeholder="https://contoh.com" required><button>Simpan URL</button></form><hr><h2>Ganti Password Admin</h2><form id="adminpass"><input id="adminPass" type="password" placeholder="Password baru" required><button>Ganti Password</button></form><p id="msg"></p></main><script>const msg=document.getElementById('msg');async function init(){const r=await fetch('/api/me');const d=await r.json();if(!d.authenticated||d.user.role!=='admin')return location='/';loadUsers()}async function loadUsers(){const r=await fetch('/api/admin/users');const a=await r.json();document.getElementById('users').innerHTML=a.map(u=>`<div class="user"><b>${u.username}</b> <small>${u.role}</small> <button onclick="toggleUser(${u.id},${!u.active})">${u.active?'Nonaktifkan':'Aktifkan'}</button> ${u.role==='user'?`<button onclick="changePass(${u.id})">Ganti Password</button><button onclick="delUser(${u.id})">Hapus</button>`:''}</div>`).join('')}async function toggleUser(id,active){await fetch('/api/admin/users/'+id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({active})});loadUsers()}async function changePass(id){const p=prompt('Password baru untuk user:');if(!p)return;const r=await fetch('/api/admin/users/'+id+'/password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p})});msg.textContent=r.ok?'Password user berhasil diganti':'Gagal mengganti password'}async function delUser(id){if(confirm('Hapus user ini?')){await fetch('/api/admin/users/'+id,{method:'DELETE'});loadUsers()}}document.getElementById('add').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/users',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:newUser.value,password:newPass.value})});msg.textContent=r.ok?'User dibuat':'Gagal membuat user';if(r.ok){e.target.reset();loadUsers()}};document.getElementById('iframe').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/iframe',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({url:url.value})});msg.textContent=r.ok?'URL iframe disimpan':'Gagal menyimpan URL'};document.getElementById('adminpass').onsubmit=async e=>{e.preventDefault();const me=await fetch('/api/me').then(r=>r.json());const users=await fetch('/api/admin/users').then(r=>r.json());const admin=users.find(u=>u.username===me.user.username);if(!admin)return;const r=await fetch('/api/admin/users/'+admin.id+'/password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:adminPass.value})});msg.textContent=r.ok?'Password admin berhasil diganti':'Gagal mengganti password';e.target.reset()};document.getElementById('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location='/'};init();</script></body></html>
